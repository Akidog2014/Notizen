<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <!-- PWA -->
    <meta name="theme-color" content="#007aff">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="default">

    <meta name="apple-mobile-web-app-title"
          content="Erfassung">

    <link rel="manifest"
          href="manifest.json">

    <link rel="apple-touch-icon"
          href="icons/icon-192.png">

    <title>Erfassung</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 20px;

            padding-bottom: 50px;

            background: #f2f2f7;

            color: #1c1c1e;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
        }


        .container {

            width: 100%;

            max-width: 700px;

            margin: auto;
        }


        h1 {

            text-align: center;

            font-size: 30px;

            margin: 10px 0 25px;
        }


        h2 {

            margin-top: 0;

            font-size: 22px;
        }


        .box {

            background: white;

            padding: 18px;

            border-radius: 16px;

            margin-bottom: 20px;

            box-shadow:
                0 2px 8px
                rgba(0,0,0,0.08);
        }


        label {

            display: block;

            font-weight: 600;

            margin-top: 14px;

            margin-bottom: 6px;
        }


        input,
        textarea {

            width: 100%;

            padding: 14px;

            font-size: 17px;

            border-radius: 11px;

            border: 1px solid #c7c7cc;

            background: white;

            color: #1c1c1e;

            -webkit-appearance: none;
        }


        input:focus,
        textarea:focus {

            outline: none;

            border-color: #007aff;

            box-shadow:
                0 0 0 2px
                rgba(0,122,255,0.15);
        }


        textarea {

            min-height: 150px;

            resize: vertical;

            line-height: 1.45;
        }


        button {

            width: 100%;

            padding: 15px;

            margin-top: 12px;

            border: none;

            border-radius: 12px;

            font-size: 17px;

            font-weight: 600;

            cursor: pointer;
        }


        button:active {

            opacity: 0.7;
        }


        .blue {

            background: #007aff;

            color: white;
        }


        .green {

            background: #34c759;

            color: white;
        }


        .red {

            background: #ff3b30;

            color: white;
        }


        .gray {

            background: #8e8e93;

            color: white;
        }


        .entry {

            border-top:
                1px solid #e5e5ea;

            padding-top: 18px;

            margin-top: 18px;
        }


        .entry:first-child {

            border-top: none;

            padding-top: 0;

            margin-top: 0;
        }


        .entry-title {

            font-size: 18px;

            font-weight: 700;

            margin-bottom: 6px;
        }


        .timestamp {

            color: #636366;

            font-size: 15px;

            margin-bottom: 8px;
        }


        .count {

            color: #636366;

            font-size: 15px;

            margin-bottom: 15px;
        }


        .status {

            text-align: center;

            font-size: 14px;

            color: #636366;

            margin-top: 12px;
        }


        .empty {

            text-align: center;

            color: #8e8e93;

            padding: 15px;
        }

    </style>

</head>


<body>

<div id="app">

    <div class="container">


        <h1>
            Erfassung
        </h1>


        <!-- PERSON -->

        <div class="box">

            <h2>
                Person
            </h2>


            <label for="name">
                Name
            </label>

            <input
                id="name"
                type="text"
                placeholder="Name"
                autocomplete="family-name"
            >


            <label for="firstName">
                Vorname
            </label>

            <input
                id="firstName"
                type="text"
                placeholder="Vorname"
                autocomplete="given-name"
            >


            <label for="birthDate">
                Geburtsdatum
            </label>

            <input
                id="birthDate"
                type="date"
            >

        </div>


        <!-- EINTRÄGE -->

        <div class="box">

            <h2>
                Einträge
            </h2>


            <div
                id="entryCount"
                class="count"
            >
                Keine Einträge
            </div>


            <div id="entries">

                <div class="empty">
                    Noch keine Einträge vorhanden.
                </div>

            </div>


            <button
                class="blue"
                onclick="newEntry()"
            >
                + Neuer Eintrag
            </button>

        </div>


        <!-- AKTIONEN -->

        <div class="box">

            <button
                class="green"
                onclick="sendEmail()"
            >
                ✉️ E-Mail versenden
            </button>


            <button
                class="red"
                onclick="deleteEverything()"
            >
                🗑️ Alle Daten löschen
            </button>


            <div
                id="status"
                class="status"
            >
                💾 Lokal gespeichert
            </div>

        </div>

    </div>

</div>


<script>

/* =====================================================
   KONFIGURATION
===================================================== */

const STORAGE_KEY =
    "ERFASSUNG_APP_V4";


/* =====================================================
   GLOBALE DATEN
===================================================== */

let appData = null;

let saveTimer = null;


/* =====================================================
   STANDARD-DATEN
===================================================== */

function createEmptyData() {

    return {

        name: "",

        firstName: "",

        birthDate: "",

        entries: []

    };

}


/* =====================================================
   DATEN LADEN
===================================================== */

function loadData() {

    const raw =
        localStorage.getItem(
            STORAGE_KEY
        );


    if (!raw) {

        appData =
            createEmptyData();

        saveImmediately();

        return;

    }


    try {

        appData =
            JSON.parse(raw);


        /*
           Sicherheitshalber fehlende
           Eigenschaften ergänzen.
        */

        if (!appData.name) {

            appData.name = "";

        }


        if (!appData.firstName) {

            appData.firstName = "";

        }


        if (!appData.birthDate) {

            appData.birthDate = "";

        }


        if (!Array.isArray(
            appData.entries
        )) {

            appData.entries = [];

        }

    }

    catch (error) {

        console.error(
            "Fehler beim Laden:",
            error
        );


        appData =
            createEmptyData();

        saveImmediately();

    }

}


/* =====================================================
   SOFORT SPEICHERN
===================================================== */

function saveImmediately() {

    if (!appData) {

        return;

    }


    try {

        localStorage.setItem(

            STORAGE_KEY,

            JSON.stringify(
                appData
            )

        );


        updateStatus(
            "✓ Lokal gespeichert"
        );

    }

    catch (error) {

        console.error(
            error
        );


        updateStatus(
            "⚠️ Fehler beim Speichern"
        );

    }

}


/* =====================================================
   VERZÖGERT SPEICHERN
===================================================== */

function save() {

    clearTimeout(
        saveTimer
    );


    saveTimer =
        setTimeout(
            function() {

                saveImmediately();

            },
            300
        );

}


/* =====================================================
   STATUS
===================================================== */

function updateStatus(
    text
) {

    const status =
        document.getElementById(
            "status"
        );


    if (status) {

        status.textContent =
            text;

    }

}


/* =====================================================
   PERSONENDATEN
===================================================== */

document
    .getElementById("name")
    .addEventListener(
        "input",
        function() {

            appData.name =
                this.value;

            save();

        }
    );


document
    .getElementById("firstName")
    .addEventListener(
        "input",
        function() {

            appData.firstName =
                this.value;

            save();

        }
    );


document
    .getElementById("birthDate")
    .addEventListener(
        "change",
        function() {

            appData.birthDate =
                this.value;

            save();

        }
    );


/* =====================================================
   NEUER EINTRAG
===================================================== */

function newEntry() {

    if (!appData) {

        return;

    }


    const now =
        new Date();


    const timestamp =
        now.toLocaleString(
            "de-CH",
            {
                dateStyle: "short",
                timeStyle: "medium"
            }
        );


    appData.entries.push({

        timestamp:
            timestamp,

        text: ""

    });


    saveImmediately();


    render();


    setTimeout(
        function() {

            const fields =
                document.querySelectorAll(
                    ".entry textarea"
                );


            if (
                fields.length > 0
            ) {

                const last =
                    fields[
                        fields.length - 1
                    ];


                last.focus();


                last.scrollIntoView({

                    behavior: "smooth",

                    block: "center"

                });

            }

        },
        100
    );

}


/* =====================================================
   ANZEIGE
===================================================== */

function render() {

    if (!appData) {

        return;

    }


    document.getElementById(
        "name"
    ).value =
        appData.name || "";


    document.getElementById(
        "firstName"
    ).value =
        appData.firstName || "";


    document.getElementById(
        "birthDate"
    ).value =
        appData.birthDate || "";


    const container =
        document.getElementById(
            "entries"
        );


    const count =
        document.getElementById(
            "entryCount"
        );


    container.innerHTML =
        "";


    if (
        appData.entries.length === 0
    ) {

        count.textContent =
            "Keine Einträge";


        container.innerHTML =
            '<div class="empty">' +
            'Noch keine Einträge vorhanden.' +
            '</div>';

        return;

    }


    count.textContent =
        appData.entries.length +
        (
            appData.entries.length === 1
                ? " Eintrag"
                : " Einträge"
        );


    appData.entries.forEach(
        function(entry, index) {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "entry";


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "entry-title";


            title.textContent =
                "Eintrag " +
                (index + 1);


            const time =
                document.createElement(
                    "div"
                );


            time.className =
                "timestamp";


            time.textContent =
                "Zeitstempel: " +
                entry.timestamp;


            const textarea =
                document.createElement(
                    "textarea"
                );


            textarea.placeholder =
                "Text eingeben...";


            textarea.value =
                entry.text || "";


            textarea.addEventListener(
                "input",
                function() {

                    appData
                        .entries[index]
                        .text =
                        this.value;


                    save();

                }
            );


            div.appendChild(
                title
            );


            div.appendChild(
                time
            );


            div.appendChild(
                textarea
            );


            container.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   E-MAIL
===================================================== */

function sendEmail() {

    if (!appData) {

        return;

    }


    let body = "";


    body +=
        "PERSONENDATEN\n";

    body +=
        "====================\n\n";


    body +=
        "Name: " +
        (appData.name || "") +
        "\n";


    body +=
        "Vorname: " +
        (appData.firstName || "") +
        "\n";


    body +=
        "Geburtsdatum: " +
        (appData.birthDate || "") +
        "\n\n";


    body +=
        "EINTRÄGE\n";

    body +=
        "====================\n\n";


    appData.entries.forEach(
        function(entry, index) {

            body +=
                "Eintrag " +
                (index + 1) +
                "\n";


            body +=
                "Zeitstempel: " +
                entry.timestamp +
                "\n\n";


            body +=
                entry.text +
                "\n\n";


            body +=
                "--------------------\n\n";

        }
    );


    const subject =
        "Erfassung " +
        (appData.firstName || "") +
        " " +
        (appData.name || "");


    const mailto =
        "mailto:?subject=" +
        encodeURIComponent(
            subject
        ) +
        "&body=" +
        encodeURIComponent(
            body
        );


    window.location.href =
        mailto;

}


/* =====================================================
   ALLES LÖSCHEN
===================================================== */

function deleteEverything() {

    const answer =
        confirm(

            "ACHTUNG!\n\n" +

            "Alle gespeicherten Daten " +
            "werden endgültig gelöscht.\n\n" +

            "Diese Aktion kann nicht " +
            "rückgängig gemacht werden.\n\n" +

            "Möchtest du wirklich fortfahren?"

        );


    if (!answer) {

        return;

    }


    clearTimeout(
        saveTimer
    );


    localStorage.removeItem(
        STORAGE_KEY
    );


    appData = null;


    location.reload();

}


/* =====================================================
   SERVICE WORKER
===================================================== */

if (
    "serviceWorker" in navigator
) {

    window.addEventListener(
        "load",
        function() {

            navigator.serviceWorker
                .register(
                    "sw.js"
                )
                .then(
                    function(registration) {

                        console.log(
                            "Service Worker registriert:",
                            registration.scope
                        );

                    }
                )
                .catch(
                    function(error) {

                        console.error(
                            "Service Worker Fehler:",
                            error
                        );

                    }
                );

        }
    );

}


/* =====================================================
   START
===================================================== */

loadData();

render();

</script>

</body>

</html>
